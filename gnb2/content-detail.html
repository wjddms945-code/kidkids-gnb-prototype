<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콘텐츠 상세 | 키드키즈 멤버십전용관</title>
<style>
  :root{
    --bg:#07070c;
    --fg:#f4f4f7;
    --pink:#ff2e63;
    --muted:#9a9aa8;
    --border:rgba(255,255,255,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}

  header.gnb{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;
    padding:16px clamp(20px,5vw,60px);
    background:linear-gradient(180deg,rgba(7,7,12,.92),rgba(7,7,12,.75));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .back-link{
    display:inline-flex;align-items:center;gap:8px;
    font-size:15px;font-weight:700;color:var(--fg);
    padding:8px 4px;
    cursor:pointer;
    background:none;border:none;font-family:inherit;
    transition:color .18s ease;
  }
  .back-link:hover{color:var(--pink)}
  .back-link .arrow{font-size:18px;line-height:1}

  .breadcrumb-bar{
    max-width:1280px;margin:0 auto;
    padding:14px clamp(20px,5vw,60px) 0;
    font-size:13px;color:var(--muted);
  }
  .breadcrumb-bar .crumb-current{color:var(--fg);font-weight:700}

  main{
    max-width:1280px;
    margin:0 auto;
    padding:clamp(24px,4vh,48px) clamp(20px,5vw,60px) clamp(60px,8vh,96px);
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---- single detail card: left info/CTA (35~40%) + right media panel
     (60~65%), both inside one bordered card instead of two floating
     blocks — layout structure only borrowed from the reference (a light
     "2026 무신사 임팩트 리포트" split card); colors/tone stay this page's
     own dark + pink-accent look, not the reference's white/gradient. ---- */
  .detail-layout{
    display:flex;
    align-items:stretch;
    background:#131319;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
  }
  .detail-info{
    flex:0 0 clamp(280px,38%,420px);
    display:flex;
    flex-direction:column;
    /* bottom-anchors the whole title/tags/description(/CTA) group as one
       block, rather than pinning the title to the top — matches the right
       panel's media, which is vertically centered within the same
       stretched-height column (see .detail-media below), so with equal
       padding on both sides the two naturally line up at the bottom. */
    justify-content:flex-end;
    padding:clamp(36px,4vw,48px);
  }
  .detail-media{
    flex:1;min-width:0;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(36px,4vw,48px);
    background:rgba(0,0,0,.18);
  }
  @media (max-width:860px){
    .detail-layout{flex-direction:column}
    .detail-info{flex:1 1 auto;order:2}
    .detail-media{order:1;width:100%}
  }

  /* ---- video media (right column) ---- */
  .detail-video-wrap{
    position:relative;width:100%;aspect-ratio:16/9;
    border-radius:16px;overflow:hidden;
    background:#000;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .detail-player{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .detail-video-wrap .poster-fallback{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .detail-video-wrap .center-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:72px;height:72px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(7,7,12,.6);backdrop-filter:blur(4px);
    border:2px solid rgba(255,255,255,.85);
    color:#fff;font-size:24px;padding:0 0 0 4px;
    cursor:pointer;transition:transform .2s ease,background .2s ease,border-color .2s ease;
  }
  .detail-video-wrap .center-play:hover{transform:translate(-50%,-50%) scale(1.08);background:var(--pink);border-color:#fff}

  /* ---- decorative (non-functional) player chrome: shown on the video
     layout whenever there's no real videoUrl/legacyGate connected yet, so
     the video detail view always reads as "a video plays here" instead of
     a bare poster. Purely visual — no click/state behavior. ---- */
  .player-center-icon{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:76px;height:76px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(7,7,12,.55);backdrop-filter:blur(4px);
    border:2px solid rgba(255,255,255,.85);
    color:#fff;font-size:26px;padding:0 0 0 4px;
    pointer-events:none;
  }
  .player-controlbar{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;align-items:center;gap:10px;
    padding:10px 16px 14px;
    background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);
    pointer-events:none;
  }
  .player-controlbar .pc-icon{font-size:14px;color:#fff;opacity:.9}
  .player-controlbar .pc-time{font-size:11.5px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
  .player-controlbar .pc-progress{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
  .player-controlbar .pc-progress-fill{width:24%;height:100%;background:var(--pink)}

  /* decorative chrome is clickable (opens the review-only video popup,
     see openVideoModal) whenever there's no real video/legacyGate wired
     up yet — a visible hover/press cue so it still reads as "a real
     player" rather than a static image. */
  .video-wrap-clickable{cursor:pointer;transition:transform .15s ease}
  .video-wrap-clickable:hover .player-center-icon{transform:translate(-50%,-50%) scale(1.08);background:var(--pink);border-color:#fff}
  .video-wrap-clickable:active{transform:scale(.99)}

  /* ---- review-only video popup: opens on a click of the (non-functional)
     video player, purely to make the "플레이어를 누르면 재생 화면이 열리는"
     flow reviewable. No real playback — same decorative chrome as the
     detail page's player, just presented full-screen in a modal. ---- */
  .video-modal-overlay{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:center;justify-content:center;
    padding:40px;
    background:rgba(0,0,0,.84);
    opacity:0;visibility:hidden;
    transition:opacity .2s ease;
  }
  .video-modal-overlay.open{opacity:1;visibility:visible}
  .video-modal{
    position:relative;
    width:100%;max-width:960px;
    transform:scale(.97);
    transition:transform .2s ease;
  }
  .video-modal-overlay.open .video-modal{transform:scale(1)}
  .video-modal-player{width:100%}
  /* closed button sits outside the player, to its right, on PC (enough
     room exists once the overlay's own padding + this offset both fit) —
     falls back to overlapping the player's own top-right corner only when
     space is tight (narrow/mobile), per the brief. */
  .video-modal-close{
    position:absolute;top:0;right:-54px;z-index:1;
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(7,7,12,.6);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;font-size:16px;
    cursor:pointer;font-family:inherit;
    transition:background .2s ease,transform .2s ease;
  }
  .video-modal-close:hover{background:rgba(255,46,99,.85);transform:scale(1.06)}
  @media (max-width:1100px){
    .video-modal-close{top:14px;right:14px}
  }
  body.video-modal-locked{overflow:hidden}

  /* ---- worksheet / pdf preview (right column): fills the whole media
     panel edge-to-edge (see .detail-media--preview, which drops its own
     padding so this can reach the card's own rounded corners) using the
     same thumbnail twice — a cropped, darkened, lightly-blurred version as
     the full-bleed background, and the real unstretched image centered on
     top — so the space around a tall vertical thumbnail reads as an
     intentional premium media panel instead of empty space. ---- */
  .detail-media--preview{padding:0}
  .detail-preview-panel{
    position:relative;
    width:100%;height:100%;min-height:360px;
    overflow:hidden;
  }
  .detail-preview-bg{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    filter:blur(6px) brightness(.5);
    transform:scale(1.1); /* hides blurred edge fringing */
  }
  .detail-preview-tint{position:absolute;inset:0;background:rgba(0,0,0,.32)}
  .detail-preview-label{
    position:absolute;top:18px;left:18px;z-index:2;
    font-size:12.5px;font-weight:700;color:#fff;letter-spacing:.02em;
    padding:6px 12px;border-radius:8px;
    background:rgba(7,7,12,.5);backdrop-filter:blur(4px);
  }
  .detail-preview-fg-wrap{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
    padding:clamp(32px,4vw,44px);
  }
  .detail-preview-fg{
    max-width:clamp(300px,24vw,340px);
    max-height:clamp(420px,52vh,480px);
    width:auto;height:auto;
    object-fit:contain;
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .icon-fallback-panel{
    width:240px;height:240px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:84px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }

  /* ---- left column: title / tags / description / CTA ---- */
  .detail-title{
    margin:0 0 14px;
    font-size:clamp(22px,2.6vw,30px);
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.25;
    color:#fff;
  }

  .tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tag{
    padding:5px 12px;border-radius:7px;
    font-size:12.5px;font-weight:700;
    background:rgba(255,255,255,.08);
    color:#c4c4d0;
    border:1px solid rgba(255,255,255,.1);
  }
  .tag-brand{
    background:rgba(255,46,99,.16);
    color:#ff9db8;
    border-color:rgba(255,46,99,.3);
  }
  .tag-type{
    background:rgba(124,184,255,.14);
    color:#8fc4ff;
    border-color:rgba(124,184,255,.3);
  }

  .detail-desc{
    margin:0 0 26px;
    font-size:15px;
    line-height:1.7;
    color:var(--muted);
  }
  .detail-desc:empty{display:none;margin-bottom:0}

  .detail-cta{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:15px 26px;
    border:none;border-radius:12px;
    background:var(--pink);
    color:#fff;
    font-size:16px;font-weight:800;
    cursor:pointer;
    font-family:inherit;
    box-shadow:0 14px 34px rgba(255,46,99,.4);
    transition:transform .2s ease,background .2s ease;
    align-self:flex-start;
  }
  .detail-cta:hover{transform:translateY(-2px);background:#ff1a52}

  /* ---- "함께 보면 좋은 콘텐츠" — single horizontal row, below the main
     detail layout, so the page doesn't end in a large empty area. ---- */
  .related-section{margin-top:clamp(48px,7vh,80px)}
  .related-title{
    font-size:18px;font-weight:800;color:#fff;
    margin:0 0 18px;
  }
  /* 6 equal columns filling the exact same container width as the detail
     card above (both are plain block children of #detail-root/main, so
     their left/right edges already match) — grows the cards themselves to
     fill the row instead of leaving trailing space after a fixed-width
     flex row. Narrow screens fall back to the original horizontal-scroll
     flex row (see the 640px override below). */
  .related-row{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:18px;
  }
  .related-card{
    cursor:pointer;
    border-radius:12px;
    overflow:hidden;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    transition:transform .2s ease,border-color .2s ease;
  }
  .related-card:hover{transform:translateY(-4px);border-color:rgba(255,46,99,.4)}
  .related-thumb{
    position:relative;width:100%;aspect-ratio:3/4;
    background:linear-gradient(150deg,#1a1030,#2c1560);
    overflow:hidden;
  }
  .related-thumb img{width:100%;height:100%;display:block;object-fit:cover}
  .related-thumb .icon-fallback{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;
  }
  .related-info{padding:10px 12px 14px}
  .related-card-title{
    font-size:13.5px;font-weight:700;color:#fff;line-height:1.4;
    margin:0 0 7px;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .related-tag{
    display:inline-block;
    font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:6px;
    background:rgba(124,184,255,.14);color:#8fc4ff;
    border:1px solid rgba(124,184,255,.3);
  }

  @media (max-width:640px){
    .detail-thumb-wrap{max-width:280px}
    .detail-cta{width:100%}
    /* back to the original horizontal-scroll row — 6 equal grid columns
       get too narrow to read on phones. */
    .related-row{
      display:flex;gap:16px;
      overflow-x:auto;
      scrollbar-width:none;
      padding-bottom:4px;
    }
    .related-row::-webkit-scrollbar{display:none}
    .related-card{flex:0 0 140px}
  }
</style>

        tags: ["멤버십"],
        originalDetailUrl: "",
        actionType: "none",
        videoUrl: "",
        downloadUrl: ""
      },
      "st-307": {
        type: "unknown",
        title: "다람쥐 놀이터 자료 모음",
        thumbnail: "https://jfcafpyzebaeasbzudbm.supabase.co/storage/v1/object/public/membership-thumbnails/membership-st-307/membership-st-307-1791423953660.webp?v=1791423953660",
        description: "글자 · 도안 · 가을 열매",
        tags: ["테마","멤버십"],
        originalDetailUrl: "",
        actionType: "none",
        videoUrl: "",
        downloadUrl: ""
      },
    };

    function el(tag, attrs, children){
      var node = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function(k){
        if(k === "class") node.className = attrs[k];
        else if(k === "text") node.textContent = attrs[k];
        else if(k === "disabled") { if(attrs[k]) node.setAttribute("disabled","disabled"); }
        else node.setAttribute(k, attrs[k]);
      });
      (children || []).forEach(function(c){ if(c) node.appendChild(c); });
      return node;
    }

    // "유형" tag label. Called with the resolved *review* type (see
    // resolveReviewType) rather than content.type directly, so a demo-split
    // item's tag always matches the layout actually shown for it.
    function typeLabel(type){
      if(type === "video") return "영상";
      if(type === "worksheet") return "활동지";
      if(type === "pdf") return "PDF";
      return null;
    }

    // builds a list of { text, variant } — variant is "type" for the one
    // derived tag, "brand" for the trailing 멤버십 tag, or "" for the rest.
    // keeping the variant attached to each tag (instead of re-deriving it
    // later by comparing text) avoids false positives if a category tag
    // ever happens to match a type label string.
    function buildTags(content, reviewType){
      var tags = [];
      var tl = typeLabel(reviewType);
      if(tl) tags.push({ text: tl, variant: "type" });
      (content.tags || []).forEach(function(t){
        // skip "멤버십" (re-added at the end as the brand tag) and skip
        // anything that duplicates the derived type tag already added above
        if(t !== "멤버십" && t !== tl) tags.push({ text: t, variant: "" });
      });
      tags.push({ text: "멤버십", variant: "brand" });
      return tags;
    }

    function renderTags(tags){
      var row = el("div", { class: "tag-row" });
      tags.forEach(function(t){
        var cls = "tag" + (t.variant ? " tag-" + t.variant : "");
        row.appendChild(el("span", { class: cls, text: t.text }));
      });
      return row;
    }

    /* ============================ media (right column) ============================ */

    // review type "video" -> large 16:9 player area, and no left CTA at all
    // (see render()) — the player here is the only action surface. A real
    // videoUrl/legacyGate shows the actual functional center-play button;
    // with neither yet, it falls back to decorative (non-functional) player
    // chrome — see renderVideoMedia below.
    /* ============================================================
       action resolution — mirrors how kidkids.net itself gates content:
       "동영상 보기" on the real site doesn't carry a direct playable URL;
       it's wired to a page-local confirm()-style gate (mship_msg()) that
       isn't something a separate page can call (it's not a shared/reusable
       permission API — it's inline, page-specific, and for an unauthenticated
       visitor it's just a one-way "upgrade your membership" prompt with no
       branch that actually unlocks playback). The real unlock logic lives
       behind kidkids.net's own login session, which isn't inspectable from
       here. So instead of calling a function we can't actually reuse, each
       content item declares how it *can* be used right now:

         actionType: "video"      -> we hold a real, direct videoUrl
         actionType: "download"   -> we hold a real, direct downloadUrl
         actionType: "legacyGate" -> no direct URL, but we hold the real
                                      kidkids.net detail page for this item;
                                      the CTA opens it in a new tab and lets
                                      kidkids.net's own login/membership
                                      check decide access — exactly the real
                                      "로그인 확인 → 회원등급 확인 → 이용" flow,
                                      just not reimplemented here
         actionType: "none"       -> no confirmed way to use this item yet

       All 73 items pulled from the live page are "none" for now (we don't
       have a verified mapping from this prototype's cards to real
       kidkids.net content URLs) — the structure above is ready the moment
       that mapping exists: fill in videoUrl/downloadUrl/originalDetailUrl
       and flip actionType, nothing else needs to change.
       ============================================================ */
    function resolveAction(content){
      var at = content.actionType || "none";
      if(at === "video" && content.videoUrl) return { kind: "video" };
      if(at === "download" && content.downloadUrl) return { kind: "download" };
      if(at === "legacyGate" && content.originalDetailUrl) return { kind: "legacyGate" };
      return { kind: "none" };
    }

    function openLegacyGate(url){
      window.open(url, "_blank", "noopener");
    }

    /* ============================================================
       review-only demo type split — SEPARATE layer on top of the real
       integration data above, for this internal review stage only.

       Most of the 73 items pulled from the live page have no confirmed
       type ("unknown" — we never saw a real "영상" badge or similar for
       them). Left as-is, every one of them would render identically
       (thumbnail + no CTA), so reviewers can't compare the video vs.
       download detail layouts at all. To make both visible, "unknown"
       items are deterministically split ~50/50 into a video-style and a
       worksheet-style detail view, purely for this review pass.

       This never writes to content.type — the real/unconfirmed value is
       left untouched so it's still there the moment someone confirms the
       real type. resolveAction()/originalDetailUrl/actionType/videoUrl/
       downloadUrl above are untouched too; when real values are filled
       in later, the real playback/download/legacyGate behavior already
       wired into renderVideoMedia/renderDownloadCta below takes over
       automatically, with zero changes needed to this function.
       ============================================================ */
    function simpleHash(str){
      var h = 0;
      for(var i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
      return Math.abs(h);
    }

    function resolveReviewType(content){
      if(content.type === "video") return "video";
      if(content.type === "worksheet" || content.type === "pdf") return "worksheet";
      return simpleHash(content.id) % 2 === 0 ? "video" : "worksheet";
    }

    /* ============================ media (right column) ============================ */

    // type = video -> large 16:9 player area.
    //   action "video"      -> poster shows a center play button; clicking it
    //                          (or the left CTA) swaps in the real <video>.
    //   action "legacyGate" -> poster shows a center play button too, but it
    //                          opens the real kidkids.net page instead — same
    //                          visual affordance, honest about where playback
    //                          actually happens.
    //   action "none"       -> poster only, no button pretending to do something.
    // shared decorative (non-functional) player chrome — center play icon +
    // bottom control bar — reused by both the in-page video card (see
    // renderVideoMedia below) and the review-only popup (see
    // openVideoModal), so the two always look identical.
    function buildDecorativePlayerChrome(){
      var nodes = [];
      nodes.push(el("div", { class: "player-center-icon", text: "▶" }));
      var bar = el("div", { class: "player-controlbar" });
      bar.appendChild(el("span", { class: "pc-icon", text: "▶" }));
      bar.appendChild(el("span", { class: "pc-time", text: "0:00" }));
      bar.appendChild(el("div", { class: "pc-progress" }, [el("div", { class: "pc-progress-fill" })]));
      bar.appendChild(el("span", { class: "pc-time", text: "3:24" }));
      bar.appendChild(el("span", { class: "pc-icon", text: "🔊" }));
      bar.appendChild(el("span", { class: "pc-icon", text: "⛶" }));
      nodes.push(bar);
      return nodes;
    }

    // review-only video popup — opens on a click of the decorative player
    // (see renderVideoMedia's "none" branch below). No real playback: same
    // non-functional chrome as the in-page player, just shown full-screen.
    function openVideoModal(content){
      var overlay = document.getElementById("video-modal-overlay");
      var playerArea = document.getElementById("video-modal-player");
      playerArea.className = "detail-video-wrap video-modal-player";
      playerArea.innerHTML = "";
      if(content.thumbnail){
        playerArea.appendChild(el("img", { class: "poster-fallback", src: content.thumbnail, alt: content.title }));
      }
      buildDecorativePlayerChrome().forEach(function(n){ playerArea.appendChild(n); });
      overlay.classList.add("open");
      document.body.classList.add("video-modal-locked");
    }

    function closeVideoModal(){
      document.getElementById("video-modal-overlay").classList.remove("open");
      document.body.classList.remove("video-modal-locked");
    }

    function renderVideoMedia(content){
      var poster = content.thumbnail || "";
      var wrap = el("div", { class: "detail-video-wrap" });
      if(poster){
        wrap.appendChild(el("img", { class: "poster-fallback", src: poster, alt: content.title }));
      }

      var action = resolveAction(content);

      if(action.kind === "video"){
        var playNow = function(){
          wrap.innerHTML = "";
          var video = el("video", {
            class: "detail-player",
            controls: "controls",
            playsinline: "playsinline",
            autoplay: "autoplay",
            poster: poster
          });
          video.appendChild(el("source", { src: content.videoUrl, type: "video/mp4" }));
          // setAttribute alone doesn't reliably sync the live .muted property
          // on elements created via createElement, which would silently
          // block autoplay — set it explicitly.
          video.muted = true;
          video.defaultMuted = true;
          wrap.appendChild(video);
        };
        var playBtn = el("button", { class: "center-play", type: "button", "aria-label": "재생하기", text: "▶" });
        playBtn.addEventListener("click", playNow);
        wrap.appendChild(playBtn);
      } else if(action.kind === "legacyGate"){
        var openNow = function(){ openLegacyGate(content.originalDetailUrl); };
        var gateBtn = el("button", { class: "center-play", type: "button", "aria-label": "재생하기", text: "▶" });
        gateBtn.addEventListener("click", openNow);
        wrap.appendChild(gateBtn);
      } else {
        // no real playable source wired up yet — decorative (non-functional)
        // player chrome, clickable to open the review-only popup above.
        // Swaps for the real <video>/legacyGate button above automatically
        // once actionType/videoUrl are filled in.
        wrap.classList.add("video-wrap-clickable");
        buildDecorativePlayerChrome().forEach(function(n){ wrap.appendChild(n); });
        wrap.addEventListener("click", function(){ openVideoModal(content); });
      }
      return wrap;
    }

    // worksheet/pdf preview block. capped to a modest size (see
    // .detail-thumb-wrap) with a "자료 미리보기" label, so a tall vertical
    // thumbnail reads as a preview rather than taking over the screen.
    // falls back to a centered icon/gradient block when there's no real
    // thumbnail (e.g. the 프로그램 바로가기 shortcut cards, which only ever
    // had an emoji + gradient, never a photo).
    // fills the whole right panel: a cropped/darkened/blurred copy of the
    // same thumbnail as full-bleed background, the real unstretched image
    // centered on top — see .detail-preview-panel for why.
    function renderThumbMedia(content){
      var panel = el("div", { class: "detail-preview-panel" });
      var fgWrap = el("div", { class: "detail-preview-fg-wrap" });

      if(content.thumbnail){
        panel.appendChild(el("img", { class: "detail-preview-bg", src: content.thumbnail, alt: "" }));
        panel.appendChild(el("div", { class: "detail-preview-tint" }));
        fgWrap.appendChild(el("img", { class: "detail-preview-fg", src: content.thumbnail, alt: content.title }));
      } else {
        // shortcut cards with no real photo (emoji + gradient) — no
        // background image to blur, just the icon centered in the panel.
        var fallback = el("div", { class: "icon-fallback-panel", text: content.icon || "📄" });
        if(content.iconStyle) fallback.setAttribute("style", content.iconStyle);
        fgWrap.appendChild(fallback);
      }

      panel.appendChild(el("div", { class: "detail-preview-label", text: "자료 미리보기" }));
      panel.appendChild(fgWrap);
      return panel;
    }

    /* ============================ CTA (left column) ============================ */

    // download CTA only — video-type details have no left CTA at all (the
    // player on the right is the only action surface there, see render()).
    // Always shown enabled: a real downloadUrl/legacyGate fires immediately
    // on click; until one exists, this is still a normal, clickable primary
    // button (never a disabled/"준비 중" placeholder) that simply has
    // nothing to do yet — it swaps to the real download the moment
    // actionType/downloadUrl are filled in, with no UI change needed.
    function renderDownloadCta(content){
      var btn = el("button", { class: "detail-cta", type: "button", text: "↓ 자료 다운로드" });
      btn.addEventListener("click", function(){
        var action = resolveAction(content);
        if(action.kind === "download"){
          var a = document.createElement("a");
          a.href = content.downloadUrl;
          a.download = content.title;
          document.body.appendChild(a);
          a.click();
          a.remove();
        } else if(action.kind === "legacyGate"){
          openLegacyGate(content.originalDetailUrl);
        }
      });
      return btn;
    }

    // review type ("video"/"worksheet", see resolveReviewType) -> media
    // renderer. add a new type here (e.g. "audio") + its own render*Media
    // function to extend without touching render() below.
    var TYPE_RENDERERS = {
      video: renderVideoMedia,
      worksheet: renderThumbMedia
    };

    /* ============================ breadcrumb ============================ */

    // one-level breadcrumb only ("멤버십 전용관 / <카테고리>") — picks the
    // first non-멤버십/non-유형 tag as a stand-in category label, since
    // CONTENT_DATA has no dedicated category field. Falls back to a generic
    // label rather than leaving it blank.
    function breadcrumbCategory(content, reviewType){
      var tl = typeLabel(reviewType);
      var cat = (content.tags || []).filter(function(t){ return t !== "멤버십" && t !== tl; })[0];
      return cat || "추천 테마";
    }

    function renderBreadcrumb(content, reviewType){
      var bar = document.getElementById("breadcrumb-bar");
      bar.innerHTML = "";
      bar.appendChild(document.createTextNode("멤버십 전용관 / "));
      bar.appendChild(el("span", { class: "crumb-current", text: breadcrumbCategory(content, reviewType) }));
    }

    /* ============================ related row ============================ */

    // deterministic pick (id-hash based, same rule as resolveReviewType) —
    // stable across reloads for a given content id, varies between
    // different ids, no real recommendation logic needed for this review
    // pass. Object.keys() on CONTENT_DATA preserves insertion order, so
    // this is a fixed rotation starting at a fixed offset, not a sort.
    function pickRelatedIds(currentId, count){
      var allIds = Object.keys(CONTENT_DATA).filter(function(id){ return id !== currentId; });
      if(!allIds.length) return [];
      var start = simpleHash(currentId) % allIds.length;
      var picked = [];
      for(var i = 0; i < count && i < allIds.length; i++){
        picked.push(allIds[(start + i) % allIds.length]);
      }
      return picked;
    }

    function buildRelatedCard(id){
      var item = CONTENT_DATA[id];
      if(!item) return null;
      item.id = item.id || id;
      var rt = resolveReviewType(item);

      var thumb = el("div", { class: "related-thumb" });
      if(item.thumbnail){
        thumb.appendChild(el("img", { src: item.thumbnail, alt: item.title }));
      } else {
        var fb = el("div", { class: "icon-fallback", text: item.icon || "📄" });
        if(item.iconStyle) fb.setAttribute("style", item.iconStyle);
        thumb.appendChild(fb);
      }

      var info = el("div", { class: "related-info" });
      info.appendChild(el("div", { class: "related-card-title", text: item.title }));
      var tl = typeLabel(rt);
      if(tl) info.appendChild(el("span", { class: "related-tag", text: tl }));

      var card = el("div", { class: "related-card" }, [thumb, info]);
      card.addEventListener("click", function(){
        window.location.href = "content-detail.html?id=" + encodeURIComponent(id);
      });
      return card;
    }

    // single row, 6 items max — no view count / likes / date, just
    // thumbnail + title + type tag, per the brief.
    function renderRelated(content){
      var ids = pickRelatedIds(content.id, 6);
      if(!ids.length) return null;
      var row = el("div", { class: "related-row" });
      ids.forEach(function(id){
        var card = buildRelatedCard(id);
        if(card) row.appendChild(card);
      });
      return el("div", { class: "related-section" }, [
        el("h2", { class: "related-title", text: "함께 보면 좋은 콘텐츠" }),
        row
      ]);
    }

    function render(content){
      var root = document.getElementById("detail-root");
      root.innerHTML = "";

      var reviewType = resolveReviewType(content);
      renderBreadcrumb(content, reviewType);
      var mediaRenderer = TYPE_RENDERERS[reviewType] || renderThumbMedia;

      var info = el("div", { class: "detail-info" });
      info.appendChild(el("h1", { class: "detail-title", text: content.title }));
      info.appendChild(renderTags(buildTags(content, reviewType)));
      if(content.description){
        info.appendChild(el("p", { class: "detail-desc", text: content.description }));
      }

      // worksheet's preview panel fills .detail-media edge-to-edge (see
      // .detail-media--preview / renderThumbMedia) instead of sitting in
      // its padded center like the video player does.
      var mediaClass = "detail-media" + (reviewType !== "video" ? " detail-media--preview" : "");
      var media = el("div", { class: mediaClass }, [mediaRenderer(content)]);

      // video details are driven entirely by the player on the right — no
      // separate CTA on the left (that's also the clearest visual cue that
      // distinguishes it from the download layout at a glance). .detail-info
      // bottom-anchors its whole content group (justify-content:flex-end),
      // so the CTA — appended last — ends up at the very bottom of the card.
      if(reviewType !== "video"){
        info.appendChild(renderDownloadCta(content));
      }

      root.appendChild(el("div", { class: "detail-layout" }, [info, media]));

      var related = renderRelated(content);
      if(related) root.appendChild(related);
    }

    function notFound(id){
      var bar = document.getElementById("breadcrumb-bar");
      if(bar) bar.innerHTML = "";
      var root = document.getElementById("detail-root");
      root.innerHTML = "";
      root.appendChild(el("h1", { class: "detail-title", text: "콘텐츠를 찾을 수 없어요" }));
      root.appendChild(el("p", { class: "detail-desc", text: "요청하신 콘텐츠(id: " + id + ")를 찾을 수 없습니다." }));
    }

    function boot(){
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var content = id ? CONTENT_DATA[id] : null;
      if(content){
        // attaches the lookup key onto the item itself so resolveReviewType
        // has a stable id to hash for the deterministic demo-type split.
        content.id = id;
        render(content);
      } else {
        notFound(id || "(없음)");
      }
    }

    // back button: prefer browser history so the user returns to the exact
    // scroll position AND in-memory membership state (userStatus) they were
    // at on the main page — kidkidsmembership.html holds its paid/guest
    // view purely as in-page JS state, never persisted to storage/URL, so
    // only a true history.back() (same page instance) carries it over.
    //
    // When there's no such history to go back to (e.g. direct entry via a
    // shared content-detail.html?id= link), send the user to the paid-
    // member view explicitly rather than kidkidsmembership.html's default
    // guest/signup screen — reuses the page's own userStatus state field
    // via the ?userStatus= override added for this (see the page's
    // Component constructor), not a separate membership system.
    document.getElementById("back-btn").addEventListener("click", function(){
      if(document.referrer && document.referrer.indexOf("kidkidsmembership.html") !== -1 && window.history.length > 1){
        window.history.back();
      } else {
        window.location.href = "./kidkidsmembership.html?userStatus=membership";
      }
    });

    // video popup close triggers: the X button, clicking the dim
    // background itself (but not the modal box, via the e.target===this
    // check), and Escape — X stays the primary/expected close action so a
    // stray click elsewhere doesn't feel like an accidental dismiss.
    document.getElementById("video-modal-close").addEventListener("click", closeVideoModal);
    document.getElementById("video-modal-overlay").addEventListener("click", function(e){
      if(e.target === this) closeVideoModal();
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && document.getElementById("video-modal-overlay").classList.contains("open")){
        closeVideoModal();
      }
    });

    boot();
  })();
  </script>
</body>
</html>
